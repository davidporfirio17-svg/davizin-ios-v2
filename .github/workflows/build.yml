name: Build Nyxel External iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build idevice-ffi transport backend
      run: |
        set -euo pipefail
        rustup target add aarch64-apple-ios
        cargo build \
          --manifest-path Vendor/idevice/ffi/Cargo.toml \
          --release \
          --target aarch64-apple-ios \
          --no-default-features \
          --features tunnel_tcp_stack,ring
        test -f Vendor/idevice/target/aarch64-apple-ios/release/libidevice_ffi.a
        test -f Vendor/idevice/ffi/idevice.h
        mkdir -p /tmp/idevice-ffi
        cp Vendor/idevice/target/aarch64-apple-ios/release/libidevice_ffi.a /tmp/idevice-ffi/
        cp Vendor/idevice/ffi/idevice.h /tmp/idevice-ffi/

    - name: Build
      run: |
        set -o pipefail
        xcodebuild \
          -project DavizinIOS.xcodeproj \
          -scheme DavizinIOS \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          ONLY_ACTIVE_ARCH=NO \
          ALWAYS_SEARCH_USER_PATHS=NO \
          BUILD_DIR=/tmp/davizin_build \
          build 2>&1 | tee /tmp/build.log
        
        echo "=== Build completed. Checking for .app ==="
        find /tmp/davizin_build -name "*.app" -type d 2>/dev/null || echo "No .app found"
        
        echo "=== Checking for errors in log ==="
        grep -i "error:" /tmp/build.log | head -20 || echo "No errors found"

    - name: Create IPA
      run: |
        APP=$(find /tmp/davizin_build -name "*.app" -not -path "*/simulator/*" -type d | head -1)
        if [ -z "$APP" ]; then
          echo "ERROR: No .app found"
          exit 1
        fi
        
        echo "Found app: $APP"
        du -sh "$APP"
        
        mkdir -p /tmp/Payload
        cp -r "$APP" /tmp/Payload/DavizinIOS.app
        cd /tmp && zip -r Nyxel_External_unsigned.ipa Payload/
        
        ls -lh /tmp/Nyxel_External_unsigned.ipa
        unzip -l /tmp/Nyxel_External_unsigned.ipa | head -20

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Nyxel_External_iOS_unsigned
        path: /tmp/Nyxel_External_unsigned.ipa
        retention-days: 30
