name: Build Davizin iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: |
        set -o pipefail
        xcodebuild \
          -project DavizinIOS.xcodeproj \
          -scheme DavizinIOS \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath /tmp/Davizin.xcarchive \
          IPHONEOS_DEPLOYMENT_TARGET=17.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          ALWAYS_SEARCH_USER_PATHS=NO \
          archive 2>&1 | tee /tmp/build_full.log | grep -E "error:|warning:|ARCHIVE FAILED|BUILD FAILED" | head -40
        echo "=== ERRORES ==="
        grep "error:" /tmp/build_full.log | grep -v "^/Applications" | head -20

    - name: Create IPA
      run: |
        ls /tmp/Davizin.xcarchive/Products/Applications/
        APP=$(find /tmp/Davizin.xcarchive/Products/Applications -name "*.app" | head -1)
        mkdir -p /tmp/Payload
        cp -r "$APP" /tmp/Payload/
        cd /tmp && zip -r Davizin_unsigned.ipa Payload/
        ls -lh /tmp/Davizin_unsigned.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Davizin_iOS_unsigned
        path: /tmp/Davizin_unsigned.ipa
        retention-days: 30
