name: Build Davizin iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: |
        xcodebuild \
          -project DavizinIOS.xcodeproj \
          -scheme DavizinIOS \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          IPHONEOS_DEPLOYMENT_TARGET=17.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          ONLY_ACTIVE_ARCH=NO \
          ALWAYS_SEARCH_USER_PATHS=NO \
          BUILD_DIR=/tmp/davizin_build \
          build 2>&1 | tail -20
        find /tmp/davizin_build -name "*.app" 2>/dev/null

    - name: Create IPA
      run: |
        APP=$(find /tmp/davizin_build -name "*.app" -not -path "*/simulator/*" | head -1)
        echo "App: $APP"
        du -sh "$APP"
        mkdir -p /tmp/Payload
        cp -r "$APP" /tmp/Payload/DavizinIOS.app
        cd /tmp && zip -r Davizin_unsigned.ipa Payload/
        ls -lh /tmp/Davizin_unsigned.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Davizin_iOS_unsigned
        path: /tmp/Davizin_unsigned.ipa
        retention-days: 30
