name: Build Davizin iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Compilar app
      run: |
        xcodebuild \
          -project DavizinIOS.xcodeproj \
          -scheme DavizinIOS \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath /tmp/DavizinIOS.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM=""

    - name: Crear IPA
      run: |
        cd /tmp/DavizinIOS.xcarchive/Products/Applications/
        mkdir -p Payload
        cp -r DavizinIOS.app Payload/
        zip -r /tmp/DavizinIOS_unsigned.ipa Payload/

    - name: Subir IPA
      uses: actions/upload-artifact@v4
      with:
        name: DavizinIOS_v2_unsigned
        path: /tmp/DavizinIOS_unsigned.ipa
        retention-days: 30
