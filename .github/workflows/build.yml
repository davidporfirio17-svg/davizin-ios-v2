name: Build Davizin iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: |
        xcodebuild \
          -project DavizinIOS.xcodeproj \
          -scheme DavizinIOS \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath /tmp/Davizin.xcarchive \
          IPHONEOS_DEPLOYMENT_TARGET=17.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          archive 2>&1 | tail -30
        echo "=== Buscando archive ==="
        find /tmp -name "*.xcarchive" 2>/dev/null
        find ~/Library -name "*.xcarchive" 2>/dev/null | head -5
        ls /tmp/

    - name: Create IPA
      run: |
        ARCHIVE=$(find /tmp ~/Library/Developer/Xcode/Archives -name "*.xcarchive" 2>/dev/null | head -1)
        echo "Archive encontrado: $ARCHIVE"
        find "$ARCHIVE" -name "*.app" 2>/dev/null
        APP=$(find "$ARCHIVE" -name "*.app" | head -1)
        echo "App: $APP"
        mkdir -p /tmp/Payload
        cp -r "$APP" /tmp/Payload/
        cd /tmp && zip -r Davizin_unsigned.ipa Payload/
        ls -lh /tmp/Davizin_unsigned.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Davizin_iOS_unsigned
        path: /tmp/Davizin_unsigned.ipa
        retention-days: 30
