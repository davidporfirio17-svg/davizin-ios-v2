<!doctype html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{
  --s1:#eef1f6;--s2:#e2e7ef;--ink:#1a2230;--ink-80:rgba(26,34,48,0.78);--muted:#687485;--faint:#9aa3b2;
  --line:rgba(26,34,48,0.08);--blue:#5b93ff;--cyan:#23c7cf;--green:#2fcf98;--purple:#9a6bff;--gold:#eca93a;
  --glass:rgba(255,255,255,0.58);--glass2:rgba(255,255,255,0.42);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;--eo:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;
 background:radial-gradient(120% 80% at 110% -8%,#c7cfdc 0,rgba(199,207,220,0) 46%),radial-gradient(90% 60% at -10% 8%,#fff 0,rgba(255,255,255,0) 50%),linear-gradient(180deg,#f2f5f9 0,#e3e8f0 48%,#d9dfe9 100%);background-attachment:fixed}
.planet{position:fixed;top:-120px;right:-90px;width:300px;height:300px;border-radius:50%;z-index:0;pointer-events:none;
 background:radial-gradient(circle at 32% 30%,#f4f7fb 0,#c3ccda 34%,#8d99ab 70%,#5c6676 100%);
 box-shadow:0 30px 80px -20px rgba(70,80,100,.3),inset -24px -18px 60px rgba(40,48,64,.4);opacity:.9;animation:float 12s ease-in-out infinite}
@keyframes float{50%{transform:translateY(14px)}}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:0 max(22px,env(safe-area-inset-left,0px)) 40px}
.rise{opacity:0;transform:translateY(14px);animation:rise .7s var(--eo) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.04s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}.d4{animation-delay:.3s}.d5{animation-delay:.4s}

.hero{text-align:center;padding-top:26px}
.mark{width:30px;height:30px;margin:0 auto 12px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(150deg,#3a4a6a,#1b2740);box-shadow:0 6px 16px rgba(50,60,90,.25),inset 0 1px 0 rgba(255,255,255,.25);color:#fff;font-weight:700;font-size:15px}
.hero .eye{font-size:12px;color:var(--muted);font-weight:500}
.hero h1{margin:6px 0 0;font-size:40px;font-weight:700;letter-spacing:-0.035em;line-height:1}
.hero h1 .i{color:var(--blue);font-weight:600}
.hero .tag{margin:9px 0 0;font-size:15px;color:var(--ink-80)}
.hero .tr{margin:16px auto 0;display:flex;align-items:center;justify-content:center;gap:12px;font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--muted);max-width:320px}
.hero .tr i{flex:1;height:1px;background:rgba(26,34,48,.14)}

/* buscador */
.search{margin-top:22px;border-radius:22px;padding:16px;background:var(--glass);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);border:1px solid rgba(255,255,255,.7);box-shadow:0 18px 44px -24px rgba(60,70,100,.35)}
.search .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.search input{width:100%;height:46px;border-radius:13px;border:1px solid rgba(26,34,48,.12);background:rgba(255,255,255,.7);padding:0 14px;font-size:16px;font-family:var(--f);color:var(--ink);outline:none;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;height:38px;border-radius:11px;border:1px solid rgba(26,34,48,.1);background:rgba(255,255,255,.55);font-family:var(--f);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.go{width:100%;height:50px;margin-top:12px;border:0;border-radius:14px;background:linear-gradient(180deg,#2a3650,#141c2b);color:#fff;font-family:var(--f);font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 14px 30px -12px rgba(30,40,70,.5),inset 0 1px 0 rgba(255,255,255,.18)}
.go:active{transform:scale(.985)}
.status{margin-top:12px;font-size:13px;color:var(--muted);text-align:center;min-height:16px}

/* perfil */
#profile{display:none}
.pcard{position:relative;overflow:hidden;margin-top:18px;border-radius:24px;padding:18px;display:flex;align-items:center;gap:14px;background:var(--glass);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);border:1px solid rgba(255,255,255,.7);box-shadow:0 20px 50px -24px rgba(60,70,100,.35),inset 0 1px 0 rgba(255,255,255,.8)}
.pcard::after{content:"";position:absolute;top:0;left:-70%;width:55%;height:100%;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-16deg);animation:sheen 4.8s ease-in-out 1s infinite}
@keyframes sheen{0%,72%{left:-70%}100%{left:150%}}
.av,.pid{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.pcard::after{display:none}.planet{animation:none}}
.av{width:62px;height:62px;border-radius:18px;flex:none;background:linear-gradient(150deg,#dfe6f1,#c3cedd);display:grid;place-items:center;font-weight:700;font-size:24px;color:#49576e;border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 #fff}
.pid{flex:1;min-width:0}
.pid .nm{font-size:19px;font-weight:700;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pid .uid{font-size:12px;color:var(--faint);margin-top:1px;font-variant-numeric:tabular-nums}
.pid .meta{display:flex;gap:12px;margin-top:7px}
.pid .meta b{font-size:12px;font-weight:600;color:var(--muted)}.pid .meta b i{color:var(--ink);font-style:normal}

.ranks{display:flex;gap:10px;margin-top:12px}
.rkc{flex:1;border-radius:18px;padding:14px;text-align:center;background:var(--glass2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.65);box-shadow:0 12px 30px -20px rgba(60,70,100,.3)}
.rkc .k{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.rkc .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.rkc .s{font-size:10px;color:var(--faint);margin-top:3px}

.sec{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin:26px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.st{border-radius:18px;padding:16px 12px;text-align:center;background:var(--glass2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.6)}
.st .k{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.st .v{font-size:26px;font-weight:700;letter-spacing:-0.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.st .s{font-size:10px;color:var(--faint);margin-top:4px}
.st.b .v{color:var(--blue)}.st.g .v{color:var(--green)}.st.o .v{color:#c9892a}.st.p .v{color:var(--purple)}
.outfit{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.outfit::-webkit-scrollbar{display:none}
.oit{flex:none;width:76px}
.oit .sq{width:76px;height:76px;border-radius:17px;background:var(--glass2);background-repeat:no-repeat;background-position:center;background-size:72%;border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 24px -16px rgba(60,70,100,.3)}
.foot{text-align:center;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:26px;font-weight:600}
</style></head>
<body>
<div class="planet"></div>
<div class="wrap">
  <div class="hero rise d1">
    <div class="mark">N</div>
    <div class="eye">Hecho para lo que sigue</div>
    <h1>NYXEL <span class="i">iOS</span></h1>
    <div class="tag">Más control. Un estándar más alto.</div>
    <div class="tr"><i></i><span>PRECISIÓN · CONTROL · RENDIMIENTO</span><i></i></div>
  </div>

  <div class="search rise d2">
    <div class="lbl">Encuentra un jugador</div>
    <input id="uid" inputmode="numeric" placeholder="UID del jugador" autocomplete="off">
    <div class="seg" id="seg">
      <button data-r="br" class="on">BR · NA</button>
      <button data-r="sg">SG</button>
      <button data-r="ind">IND</button>
    </div>
    <button class="go" id="go">Buscar perfil</button>
    <div class="status" id="status"></div>
  </div>

  <div id="profile">
    <div class="pcard rise d1">
      <div class="av" id="av">—</div>
      <div class="pid">
        <div class="nm" id="nm">—</div>
        <div class="uid" id="uid2">UID —</div>
        <div class="meta"><b>Lv <i id="lv">—</i></b><b>👍 <i id="likes">—</i></b><b id="regw">—</b></div>
      </div>
    </div>
    <div class="ranks rise d2">
      <div class="rkc"><div class="k">BR Clasif.</div><div class="v" id="brp">—</div><div class="s" id="brc">—</div></div>
      <div class="rkc"><div class="k">CS Clasif.</div><div class="v" id="csp">—</div><div class="s" id="csc">—</div></div>
    </div>
    <div class="sec rise d3">Resumen</div>
    <div class="grid rise d3">
      <div class="st b"><div class="k">Nivel</div><div class="v" id="g_lv">—</div><div class="s">cuenta</div></div>
      <div class="st g"><div class="k">Me gusta</div><div class="v" id="g_likes">—</div><div class="s">total</div></div>
      <div class="st o"><div class="k">Temporada</div><div class="v" id="g_season">—</div><div class="s">actual</div></div>
    </div>
    <div class="sec rise d4" id="careerSec" style="display:none">Carrera</div>
    <div class="grid rise d4" id="career"></div>
    <div class="sec rise d5" id="outfitSec" style="display:none">Outfit</div>
    <div class="outfit rise d5" id="outfit"></div>
    <div class="foot rise d5">Rendimiento · Inteligencia · Sin límites</div>
  </div>
</div>

<script>
(function(){
  var region='br';
  var seg=document.getElementById('seg');
  [].forEach.call(seg.children,function(b){b.onclick=function(){[].forEach.call(seg.children,function(x){x.classList.remove('on')});b.classList.add('on');region=b.dataset.r;};});
  function post(o){try{window.webkit.messageHandlers.nyxel.postMessage(o);}catch(e){}}
  document.getElementById('go').onclick=function(){var uid=(document.getElementById('uid').value||'').trim();if(!uid){setStatus('Escribe un UID.');return;}post({t:'lookup',uid:uid,region:region});};
  function setStatus(s){document.getElementById('status').textContent=s||'';}
  window.NYXEL_setState=function(s){ // 'loading' | 'error:msg' | 'idle'
    if(s==='loading')setStatus('Buscando perfil…');
    else if(s&&s.indexOf('error:')===0)setStatus(s.slice(6));
    else setStatus('');
  };
  function initials(n){if(!n)return '—';var p=n.replace(/[^A-Za-z0-9 ]/g,'').trim().split(/\s+/);return ((p[0]||'')[0]||'N').toUpperCase()+((p[1]||'')[0]||'').toUpperCase();}
  var REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function grp(n){return Math.round(n).toLocaleString('es-MX').replace(/,/g,' ');}
  function animNum(id,val,delay){var el=document.getElementById(id);if(!el)return;
    var t=(val==null?'':(''+val)).replace(/[\s,]/g,'');
    if(!/^\d+$/.test(t)){el.textContent=(val==null||val==='')?'—':val;return;}
    var n=parseInt(t,10);if(REDUCE){el.textContent=grp(n);return;}
    el.textContent='0';
    setTimeout(function(){var t0=null,dur=850+Math.random()*450;
      function st(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=grp(n*e);if(p<1)requestAnimationFrame(st);}
      requestAnimationFrame(st);},delay||0);}
  window.NYXEL_setProfile=function(json){
    var d;try{d=typeof json==='string'?JSON.parse(json):json;}catch(e){return;}
    setStatus('');
    document.getElementById('profile').style.display='block';
    document.getElementById('av').textContent=initials(d.nickname);
    document.getElementById('nm').textContent=d.nickname||'Jugador de Free Fire';
    document.getElementById('uid2').textContent='UID '+(d.uid||'—');
    document.getElementById('regw').textContent=(d.region||'FF').toUpperCase();
    document.getElementById('brc').textContent=d.brRank?('Código '+d.brRank):'Battle Royale';
    document.getElementById('csc').textContent=d.csRank?('Código '+d.csRank):'Clash Squad';
    document.getElementById('g_season').textContent=d.season||'—';
    animNum('lv',d.level,120);animNum('likes',d.likes,220);
    animNum('brp',d.brPoints,320);animNum('csp',d.csPoints,400);
    animNum('g_lv',d.level,300);animNum('g_likes',d.likes,380);
    var car=document.getElementById('career');car.innerHTML='';
    var items=d.career||[];
    if(items.length){document.getElementById('careerSec').style.display='';
      items.slice(0,3).forEach(function(m,i){var cls=['b','g','o','p'][i%4];
        var el=document.createElement('div');el.className='st '+cls;var vid='cv'+i;
        el.innerHTML='<div class="k">'+(m.k||'')+'</div><div class="v" id="'+vid+'">0</div><div class="s">'+(m.s||'')+'</div>';
        car.appendChild(el);animNum(vid,m.v,480+i*90);});
    } else {document.getElementById('careerSec').style.display='none';}
    try{window.scrollTo({top:document.getElementById('profile').offsetTop-80,behavior:'smooth'});}catch(e){}
  };
  window.NYXEL_setOutfitCount=function(n){
    var o=document.getElementById('outfit');o.innerHTML='';
    document.getElementById('outfitSec').style.display=n>0?'':'none';
    for(var i=0;i<n;i++){var d=document.createElement('div');d.className='oit';d.id='oit'+i;d.innerHTML='<div class="sq"></div>';o.appendChild(d);}
  };
  window.NYXEL_setOutfitItem=function(i,uri){var el=document.getElementById('oit'+i);if(!el||!uri)return;el.querySelector('.sq').style.backgroundImage="url('"+uri+"')";};
})();
</script>
</body></html>
