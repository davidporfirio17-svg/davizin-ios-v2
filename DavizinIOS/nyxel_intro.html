<!doctype html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden}
  #sky{position:fixed;inset:0;display:block}
  #ext{position:fixed;left:0;right:0;top:53%;text-align:center;z-index:2;opacity:0;
       font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;font-weight:600;
       font-size:15px;letter-spacing:0.62em;padding-left:0.62em;color:#9fccff;
       transition:opacity .6s cubic-bezier(.23,1,.32,1),transform .6s cubic-bezier(.23,1,.32,1);transform:translateY(10px)}
  #ext.on{opacity:1;transform:translateY(0)}
</style></head>
<body>
<canvas id="sky"></canvas>
<div id="ext">EXTERNAL</div>
<script>
(function(){
  var cv=document.getElementById('sky'),ctx=cv.getContext('2d'),ext=document.getElementById('ext');
  var DPR=Math.min(2,window.devicePixelRatio||1),W,H,CX,CY,AR;
  function size(){W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';CX=W/2;CY=H*0.45;AR=Math.min(W,H)*0.165;appleCv=null;}
  size();addEventListener('resize',size);

  function samplePix(fn){var oc=document.createElement('canvas'),o=oc.getContext('2d');oc.width=W;oc.height=H;o.clearRect(0,0,W,H);fn(o);
    var d=o.getImageData(0,0,W,H).data,p=[],s=Math.max(4,Math.floor(5*DPR));
    for(var y=0;y<H;y+=s)for(var x=0;x<W;x+=s){if(d[(y*W+x)*4+3]>128)p.push({x:x,y:y});}return p;}
  function sLogo(){return samplePix(function(o){var fs=Math.min(W*0.2,160*DPR);o.fillStyle='#fff';o.textAlign='center';o.textBaseline='middle';
    o.font='700 '+fs+'px -apple-system,"SF Pro Display",system-ui,sans-serif';o.fillText('NYXEL',CX,CY);});}

  // Cuerpo de la manzana — silueta tipo logo de Apple (hoyuelos arriba y abajo)
  function applePath(c){var R=AR,cx=CX,cy=CY+R*0.14;
    c.beginPath();c.moveTo(cx+0.05*R,cy-0.55*R);
    c.bezierCurveTo(cx+0.55*R,cy-0.74*R, cx+1.02*R,cy-0.46*R, cx+1.02*R,cy+0.06*R);
    c.bezierCurveTo(cx+1.02*R,cy+0.58*R, cx+0.62*R,cy+1.0*R, cx+0.12*R,cy+0.9*R);
    c.bezierCurveTo(cx+0.04*R,cy+0.88*R, cx-0.04*R,cy+0.88*R, cx-0.12*R,cy+0.9*R);
    c.bezierCurveTo(cx-0.62*R,cy+1.0*R, cx-1.02*R,cy+0.58*R, cx-1.02*R,cy+0.06*R);
    c.bezierCurveTo(cx-1.02*R,cy-0.46*R, cx-0.55*R,cy-0.74*R, cx-0.05*R,cy-0.55*R);
    c.bezierCurveTo(cx-0.02*R,cy-0.57*R, cx+0.02*R,cy-0.57*R, cx+0.05*R,cy-0.55*R);c.closePath();}
  // Hoja de gota inclinada (sin tallo), como el logo de Apple
  function appleLeaf(c){var R=AR,cx=CX,cy=CY+R*0.14;
    c.save();c.translate(cx+0.12*R,cy-0.72*R);c.rotate(-0.74);
    c.beginPath();c.moveTo(0,-0.3*R);
    c.quadraticCurveTo(0.24*R,-0.08*R, 0,0.3*R);
    c.quadraticCurveTo(-0.24*R,-0.08*R, 0,-0.3*R);
    c.closePath();c.fill();c.restore();}
  function appleBite(c){var R=AR,cx=CX,cy=CY+R*0.14;c.globalCompositeOperation='destination-out';c.beginPath();c.arc(cx+1.12*R,cy-0.02*R,0.46*R,0,6.28);c.fill();c.globalCompositeOperation='source-over';}
  function sApple(){return samplePix(function(o){o.fillStyle='#fff';applePath(o);o.fill();appleLeaf(o);appleBite(o);});}

  // Lienzo con la manzana YA mordida (blanca), para que el glow siga la silueta.
  var appleCv=null;
  function makeAppleCanvas(){var c=document.createElement('canvas');c.width=W;c.height=H;var o=c.getContext('2d');
    o.fillStyle='#eff6ff';applePath(o);o.fill();appleLeaf(o);appleBite(o);appleCv=c;}

  // Manzana SÓLIDA brillante con glow + barrido de luz (como el logo de Apple)
  function drawSolidApple(a,sweep){var R=AR,cx=CX,cy=CY+R*0.16;if(!appleCv)makeAppleCanvas();
    ctx.save();ctx.globalAlpha=a;
    ctx.shadowColor='rgba(170,210,255,0.95)';ctx.shadowBlur=46*DPR;
    ctx.drawImage(appleCv,0,0);               // glow sigue la manzana mordida
    ctx.shadowBlur=0;
    if(sweep>=0){var sx=(cx-1.5*R)+(3.0*R)*sweep,g=ctx.createLinearGradient(sx-0.4*R,0,sx+0.4*R,0);
      g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.5,'rgba(255,255,255,0.9)');g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.globalCompositeOperation='source-atop';ctx.fillStyle=g;ctx.fillRect(cx-1.5*R,cy-1.3*R,3.0*R,2.6*R);}
    ctx.restore();}

  var nyx=sLogo(),apl=sApple(),N=Math.min(nyx.length,1150),P=[];
  function edge(){var a=Math.random()*6.283,r=Math.max(W,H)*0.65;return{x:CX+Math.cos(a)*r*(0.6+Math.random()*0.8),y:CY+Math.sin(a)*r*(0.6+Math.random()*0.8)};}
  function build(){[nyx,apl].forEach(function(A){for(var i=A.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=A[i];A[i]=A[j];A[j]=t;}});
    P=[];for(var i=0;i<N;i++){var s=edge(),a=nyx[i%nyx.length],b=apl[i%apl.length];
      P.push({x:s.x,y:s.y,sx:s.x,sy:s.y,ax:a.x,ay:a.y,bx:b.x,by:b.y,mx:0,my:0,d:Math.random()*0.25,r:(Math.random()*1.2+0.5)*DPR,tw:Math.random()*6.28});}}
  build();

  var t0=null,phase='form',done=false;
  var T_FORM=1.5,T_G1=0.6,HOLD1=1.1,T_M=1.1,T_REVEAL=0.5,T_SWEEP=0.95,T_HOLD=0.8,T_FADE=0.6;
  function eo(p){return 1-Math.pow(1-p,3);}function eio(p){return p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;}
  function finish(){if(done)return;done=true;try{window.webkit.messageHandlers.intro.postMessage('done');}catch(e){}}
  addEventListener('pointerdown',finish);

  function loop(ts){if(!t0)t0=ts;var el=(ts-t0)/1000;ctx.clearRect(0,0,W,H);
    var gx=-1,pga=1,aa=0,sweep=-1;
    if(phase==='form'){for(var i=0;i<P.length;i++){var p=P[i];var lo=Math.min(1,Math.max(0,(el/T_FORM-p.d)/(1-p.d))),e=eo(lo);p.x=p.sx+(p.ax-p.sx)*e;p.y=p.sy+(p.ay-p.sy)*e;}if(el>=T_FORM){phase='g1';t0=ts;ext.classList.add('on');}}
    else if(phase==='g1'){gx=(-0.2+1.4*eio(Math.min(1,el/T_G1)))*W;if(el>=T_G1+HOLD1){phase='morph';t0=ts;ext.classList.remove('on');for(var i=0;i<P.length;i++){P[i].mx=P[i].ax;P[i].my=P[i].ay;}}}
    else if(phase==='morph'){var e=eio(Math.min(1,el/T_M));for(var i=0;i<P.length;i++){var p=P[i];p.x=p.mx+(p.bx-p.mx)*e;p.y=p.my+(p.by-p.my)*e;}if(el>=T_M){phase='reveal';t0=ts;}}
    else if(phase==='reveal'){var e=Math.min(1,el/T_REVEAL);pga=1-e;aa=e;if(el>=T_REVEAL){phase='sweep';t0=ts;}}
    else if(phase==='sweep'){pga=0;aa=1;sweep=Math.min(1,el/T_SWEEP);if(el>=T_SWEEP){phase='hold';t0=ts;}}
    else if(phase==='hold'){pga=0;aa=1;if(el>=T_HOLD){phase='fade';t0=ts;}}
    else if(phase==='fade'){pga=0;aa=1-Math.min(1,el/T_FADE);if(el>=T_FADE+0.05){finish();return;}}
    // partículas (form/g1/morph/reveal)
    if(pga>0){for(var i=0;i<P.length;i++){var p=P[i];var tw=0.55+0.45*Math.sin(el*2+p.tw),a=(0.3+tw*0.5)*pga;
      if(gx>=0){var dd=Math.abs(p.x-gx);if(dd<72*DPR)a=Math.min(1,a+(1-dd/(72*DPR))*0.9);}
      ctx.fillStyle='rgba(175,212,255,'+a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();}}
    // manzana sólida
    if(aa>0)drawSolidApple(aa,sweep);
    requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
  setTimeout(finish,9000);
})();
</script>
</body></html>
