<title>Rouk · Modos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Visor 3D (GLB) a pantalla completa + selector de modos + reveal de impacto */
  :root{
    --bg:#eef1f6; --panel:rgba(255,255,255,.82); --panel-br:rgba(20,24,40,.12);
    --fg:#141826; --muted:#5a6276; --accent:#e9502f; --accent-fg:#fff; --grad-a:#dfe5f0; --grad-b:#c7cfe0;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0c0e14; --panel:rgba(20,24,34,.78); --panel-br:rgba(255,255,255,.12);
    --fg:#eef1f6; --muted:#9aa3b8; --accent:#ff6a44; --accent-fg:#160a06; --grad-a:#161a24; --grad-b:#070a10; color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0c0e14; --panel:rgba(20,24,34,.78); --panel-br:rgba(255,255,255,.12);
    --fg:#eef1f6; --muted:#9aa3b8; --accent:#ff6a44; --accent-fg:#160a06; --grad-a:#161a24; --grad-b:#070a10; color-scheme:dark;
  }
  html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 120% at 50% 16%,var(--grad-a),var(--grad-b));color:var(--fg);
    font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;transition:transform .05s}
  canvas{display:block;touch-action:none}
  .bar{position:fixed;left:0;right:0;z-index:5;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  #title{display:flex;flex-direction:column;line-height:1.05}
  #title b{font-size:1.05rem;letter-spacing:.02em}
  #title small{color:var(--muted);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase}
  #tools{display:flex;gap:.4rem;pointer-events:auto}
  .icon{width:38px;height:38px;display:grid;place-items:center;font-size:1rem;padding:0;border-radius:50%}
  #bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-top:10px}
  #modes{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;padding:.2rem 0;scroll-snap-type:x mandatory}
  #modes::-webkit-scrollbar{display:none}
  .chip{scroll-snap-align:center;white-space:nowrap;font:inherit;font-weight:700;font-size:.9rem;color:var(--fg);
    background:var(--panel);border:1.5px solid var(--panel-br);border-radius:999px;padding:.6rem 1.05rem;cursor:pointer;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .1s,border-color .15s,color .15s;flex:0 0 auto}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.45rem;vertical-align:middle;background:var(--mc,var(--accent))}
  .chip:active{transform:scale(.94)}
  .chip[aria-pressed="true"]{border-color:var(--mc,var(--accent));color:var(--mc,var(--accent))}
  button{font:inherit;font-weight:600;color:var(--fg);background:var(--panel);border:1px solid var(--panel-br);
    border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  button:active{transform:scale(.95)}
  button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #reveal{position:fixed;inset:0;display:grid;place-items:center;z-index:6;pointer-events:none}
  #flash{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:0;
    background:radial-gradient(circle,var(--mc,var(--accent)) 0%,transparent 62%);mix-blend-mode:screen}
  #word{font-weight:700;font-size:clamp(2.6rem,13vw,7rem);letter-spacing:.01em;line-height:.9;text-transform:uppercase;
    opacity:0;color:#fff;text-align:center;text-shadow:0 0 28px var(--mc,var(--accent)),0 6px 24px rgba(0,0,0,.45);transform:scale(2.4)}
  #word small{display:block;font-size:.26em;letter-spacing:.35em;color:var(--mc,var(--accent));
    -webkit-text-fill-color:var(--mc,var(--accent));margin-top:.4em;text-shadow:none}
  @keyframes slam{0%{opacity:0;transform:scale(2.5);filter:blur(14px)}55%{opacity:1;transform:scale(.94);filter:blur(0)}70%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
  @keyframes hold{0%{opacity:1}72%{opacity:1}100%{opacity:0;transform:scale(1.08)}}
  @keyframes pop{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1)}}
  .go #word{animation:slam .34s cubic-bezier(.2,1.4,.3,1) both,hold 1.5s .34s forwards}
  .go #flash{animation:pop .5s ease-out both}
  @media (prefers-reduced-motion:reduce){.go #word,.go #flash{animation-duration:.01ms}}
  #loader{position:fixed;inset:0;display:grid;place-items:center;z-index:9;color:var(--muted);font-size:.9rem;letter-spacing:.05em;background:var(--bg)}
  #loader.hide{opacity:0;pointer-events:none;transition:opacity .5s}
  .spin{width:34px;height:34px;border:3px solid var(--panel-br);border-top-color:var(--accent);border-radius:50%;animation:r 1s linear infinite;margin:0 auto .8rem}
  @keyframes r{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">

<div id="stage"></div>
<div id="top" class="bar">
  <div id="title"><b>Rouk</b><small>Modos · Free Fire</small></div>
  <div id="tools">
    <button class="icon" id="btnRotate" aria-pressed="true" title="Girar auto">↻</button>
    <button class="icon" id="btnBg" title="Fondo">◐</button>
  </div>
</div>
<div id="reveal"><div id="flash"></div><div id="word"></div></div>
<div id="bottom" class="bar"><div id="modes"></div></div>
<div id="loader"><div><div class="spin"></div>Cargando modelo…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  var MODES=[
    {id:'pecho',name:'Pecho',c:'#36d07f'},{id:'drag',name:'Drag',c:'#ffb02e'},
    {id:'body100',name:'Body 100%',c:'#ff4d4d'},{id:'head',name:'Head+Antena',c:'#ff6a44'},
    {id:'bypass',name:'Bypass',c:'#36c5ff'},{id:'ffn',name:'FF Normal',c:'#b07bff'}
  ];
  var stage=document.getElementById('stage');
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(40,1,0.01,200);
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff,0x3b4152,1.2));
  var key=new THREE.DirectionalLight(0xffffff,1.5); key.position.set(3,6,5); scene.add(key);
  var fill=new THREE.DirectionalLight(0xdfe6ff,.6); fill.position.set(-5,2,-4); scene.add(fill);
  var back=new THREE.DirectionalLight(0xffffff,.5); back.position.set(0,3,-6); scene.add(back);
  var rim=new THREE.PointLight(0xffffff,0,10); scene.add(rim);

  var controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=.08; controls.autoRotate=true; controls.autoRotateSpeed=1.3; controls.enablePan=false;

  var root=null,fitR=1.2,modelCenter=new THREE.Vector3();
  new THREE.GLTFLoader().load('rouk.glb',function(gltf){
    var obj=gltf.scene;
    obj.traverse(function(c){if(c.isMesh&&c.material){c.material.side=THREE.DoubleSide;if(c.material.map)c.material.map.anisotropy=4;}});
    obj.updateMatrixWorld(true);
    var box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3());
    obj.position.x-=ctr.x; obj.position.y-=ctr.y; obj.position.z-=ctr.z; // centra en el origen
    var pivot=new THREE.Group(); pivot.add(obj);
    var maxDim=Math.max(size.x,size.y,size.z)||1, s=2.0/maxDim;
    pivot.scale.setScalar(s); pivot.userData.base=s;
    root=pivot; scene.add(pivot); pivot.updateMatrixWorld(true);
    var wsphere=new THREE.Box3().setFromObject(pivot).getBoundingSphere(new THREE.Sphere());
    modelCenter.copy(wsphere.center); fitR=wsphere.radius||1.2; // esfera real del modelo YA escalado
    resetView();
    document.getElementById('loader').classList.add('hide');
    setTimeout(function(){selectMode(0);},300);
  },undefined,function(e){document.getElementById('loader').innerHTML='No se pudo cargar el modelo.';});

  function resetView(){
    var vfov=camera.fov*Math.PI/180;
    var dV=fitR/Math.sin(vfov/2);
    var hfov=2*Math.atan(Math.tan(vfov/2)*camera.aspect);
    var dH=fitR/Math.sin(hfov/2);
    var d=Math.max(dV,dH)*1.45; // encuadra ancho y alto, con holgura
    camera.position.set(modelCenter.x, modelCenter.y, modelCenter.z+d); // apunta al centro REAL
    controls.target.copy(modelCenter);
    controls.minDistance=d*0.25; controls.maxDistance=d*5; controls.update();
  }

  var impulse=0,spinBoost=0; function poke(){impulse=1;spinBoost=6;}
  var bgs=['transparent','#0c0e14','#eef1f6'],bgi=0;
  function resize(){var w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);if(root)resetView();}
  addEventListener('resize',resize); resize();

  var clock=new THREE.Clock();
  (function loop(){requestAnimationFrame(loop);var dt=Math.min(clock.getDelta(),.05);
    controls.autoRotateSpeed=1.3+spinBoost; spinBoost*=Math.pow(.02,dt);
    if(root){root.scale.setScalar(root.userData.base*(1+impulse*0.12));}
    impulse*=Math.pow(.004,dt); rim.intensity*=Math.pow(.02,dt);
    controls.update(); renderer.render(scene,camera);
  })();

  var reveal=document.getElementById('reveal'),word=document.getElementById('word');
  function fua(m){
    reveal.style.setProperty('--mc',m.c);
    word.innerHTML=m.name+'<small>Activado</small>';
    reveal.classList.remove('go'); void reveal.offsetWidth; reveal.classList.add('go');
    rim.color.set(m.c); rim.intensity=7; rim.position.set(0,.4,2.4);
    if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
      var n=0,iv=setInterval(function(){n++;stage.style.transform='translate('+(Math.random()*8-4)+'px,'+(Math.random()*8-4)+'px)';if(n>5){clearInterval(iv);stage.style.transform='';}},28);
    }
  }
  var modesEl=document.getElementById('modes'),chips=[];
  function selectMode(i){
    chips.forEach(function(ch,j){ch.setAttribute('aria-pressed',j===i);});
    document.querySelector('#title small').textContent=MODES[i].name+' · Free Fire';
    poke(); fua(MODES[i]);
  }
  MODES.forEach(function(m,i){
    var b=document.createElement('button');b.className='chip';b.style.setProperty('--mc',m.c);
    b.innerHTML='<span class="dot"></span>'+m.name;b.setAttribute('aria-pressed','false');
    b.onclick=function(){selectMode(i);b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});};
    modesEl.appendChild(b);chips.push(b);
  });
  var bR=document.getElementById('btnRotate');
  bR.onclick=function(){controls.autoRotate=!controls.autoRotate;bR.setAttribute('aria-pressed',controls.autoRotate);};
  document.getElementById('btnBg').onclick=function(){bgi=(bgi+1)%bgs.length;stage.style.background=bgs[bgi]==='transparent'?'':bgs[bgi];};
})();
</script>
