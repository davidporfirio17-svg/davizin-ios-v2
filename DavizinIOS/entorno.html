<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entorno</title>
<style id="monoVar">
  /* el base64 del monito se inyecta aquí por JS al cargar */
</style>
<style>
  :root{
    --ink:#f3f6ff; --ink-2:rgba(240,245,255,.72); --ink-3:rgba(230,238,255,.5);
    --blue:#0a84ff; --blue-2:#5ac8fa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{color:var(--ink);font-family:-apple-system,'SF Pro Display','SF Pro Text','Inter',system-ui,sans-serif;
    background:#000;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

  /* ===== WALLPAPER ===== blobs for Liquid Glass to refract */
  .wall{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--wall-bg,#06060c);transition:background 1s}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.85;will-change:transform;transition:background 1s}
  .b1{width:70vw;height:70vw;left:-20vw;top:-10vh;background:var(--c1);animation:drift1 22s ease-in-out infinite alternate}
  .b2{width:80vw;height:80vw;right:-30vw;top:10vh;background:var(--c2);animation:drift2 26s ease-in-out infinite alternate}
  .b3{width:70vw;height:70vw;left:-15vw;bottom:-20vh;background:var(--c3);animation:drift3 30s ease-in-out infinite alternate}
  .b4{width:55vw;height:55vw;right:-10vw;bottom:-10vh;background:var(--c4);animation:drift4 28s ease-in-out infinite alternate;opacity:.55}

  /* ===== PALETAS (cambian las variables arriba al tocar un chip) ===== */
  :root[data-pal="nyxel"]{--wall-bg:#02030a;--c1:#2fb6ff;--c2:#7a5cff;--c3:#0a84ff;--c4:#c04bff}
  :root[data-pal="titan"]{--wall-bg:#0d1015;--c1:#5a6c7f;--c2:#4a90e2;--c3:#8a9bb3;--c4:#6b5e9c}
  :root[data-pal="aurora"]{--wall-bg:#020617;--c1:#00ffb3;--c2:#a855f7;--c3:#3b82f6;--c4:#06b6d4}
  :root[data-pal="night"]{--wall-bg:#000000;--c1:#0a84ff;--c2:#1a1a2e;--c3:#162140;--c4:#2fb6ff}

  /* paleta switcher (sólo mockup) */
  .pal{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:5px;border-radius:999px;
    background:rgba(0,0,0,.45);border:0.5px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8)}
  .pal button{border:0;cursor:pointer;background:transparent;color:rgba(255,255,255,.65);font:inherit;font-weight:700;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;border-radius:999px;transition:all .22s}
  .pal button.on{color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 0.5px rgba(255,255,255,.2)}
  /* bajamos el Island para no chocar con el switcher */
  .island{margin-top:52px}
  @keyframes drift1{to{transform:translate(12vw,6vh) scale(1.1)}}
  @keyframes drift2{to{transform:translate(-10vw,-4vh) scale(.95)}}
  @keyframes drift3{to{transform:translate(6vw,-6vh) scale(1.08)}}
  @keyframes drift4{to{transform:translate(-8vw,4vh) scale(1.05)}}
  .tint{position:fixed;inset:0;z-index:1;background:radial-gradient(70% 55% at 50% 40%,transparent,rgba(0,0,0,.35) 90%)}

  /* ===== SCREEN STACK ===== */
  .scr{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom))}

  .island{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
    font-size:.68rem;font-weight:700;letter-spacing:.14em;color:#eaf0ff;text-transform:uppercase;
    background:rgba(10,12,20,.55);border:0.5px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);
    box-shadow:0 10px 30px -14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.14)}
  .island .d{width:7px;height:7px;border-radius:50%;background:#30d158;box-shadow:0 0 10px #30d158}

  .titleBlock{margin:22px 4px 10px}
  .ttl{font-size:clamp(2rem,8.4vw,2.6rem);font-weight:700;letter-spacing:-.025em;line-height:1.02;color:#fff}
  .ttl span{color:transparent;background:linear-gradient(90deg,#cfe3ff,#9fbfff);-webkit-background-clip:text;background-clip:text}
  .sub{margin-top:8px;color:var(--ink-2);font-size:1rem;line-height:1.35;max-width:36ch}

  /* ===== LIQUID GLASS CARDS ===== */
  .cards{margin-top:22px;display:flex;flex-direction:column;gap:12px}

  .glass{position:relative;padding:18px;border-radius:26px;cursor:pointer;overflow:hidden;
    background:linear-gradient(170deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.06) 55%,rgba(255,255,255,.03) 100%);
    -webkit-backdrop-filter:blur(40px) saturate(1.8) contrast(1.08);backdrop-filter:blur(40px) saturate(1.8) contrast(1.08);
    border:0.5px solid rgba(255,255,255,.14);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -1px 0 rgba(0,0,0,.25),
      inset 0 0 0 0.5px rgba(255,255,255,.04),
      0 22px 50px -20px rgba(0,0,0,.55);
    transition:transform .22s cubic-bezier(.3,.9,.3,1), border-color .25s, box-shadow .25s}
  .glass:active{transform:scale(.985)}
  .glass::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(255,255,255,.22), transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,.08), transparent 32%)}
  .glass::after{content:"";position:absolute;left:14%;right:14%;bottom:-20px;height:30px;border-radius:50%;
    background:radial-gradient(50% 100% at 50% 0%, rgba(255,255,255,.18), transparent 70%);filter:blur(10px);opacity:0;transition:opacity .3s}
  .glass.sel::after{opacity:.9}

  .row{position:relative;z-index:1;display:flex;align-items:center;gap:14px}

  /* ===== BADGE: logo del monito + anillo girando ===== */
  .icon{width:74px;height:74px;flex:0 0 74px;position:relative;display:grid;place-items:center}
  /* el monito al centro, estático */
  .icon .mono{position:relative;z-index:2;width:50px;height:50px;border-radius:50%;
    background:var(--mono) center/cover no-repeat, #0a0a1a;
    box-shadow:
      inset 0 0 0 0.5px rgba(255,255,255,.3),
      0 0 0 1px rgba(255,255,255,.08),
      0 6px 14px -4px rgba(0,0,0,.5),
      0 0 24px -4px rgba(10,132,255,.3)}
  /* anillo con texto curvado */
  .icon .ring{position:absolute;inset:0;z-index:3;pointer-events:none;
    animation:spinRing 14s linear infinite;transform-origin:center}
  .icon .ring svg{width:100%;height:100%;overflow:visible}
  .icon .ring text{font-family:-apple-system,'SF Pro Display',Inter,system-ui;font-weight:800;fill:#fff;letter-spacing:4px}
  /* halo sutil atrás */
  .icon::before{content:"";position:absolute;inset:4px;border-radius:50%;z-index:1;
    background:radial-gradient(circle at 50% 35%, rgba(80,160,255,.25), transparent 65%)}

  #c2 .icon::before{background:radial-gradient(circle at 50% 35%, rgba(170,120,255,.3), transparent 65%)}
  #c2 .icon .mono{box-shadow:
      inset 0 0 0 0.5px rgba(255,255,255,.3),
      0 0 0 1px rgba(255,255,255,.08),
      0 6px 14px -4px rgba(0,0,0,.5),
      0 0 24px -4px rgba(170,120,255,.4)}

  @keyframes spinRing{to{transform:rotate(360deg)}}

  .txt{flex:1;min-width:0}
  .name{font-size:1.18rem;font-weight:700;letter-spacing:-.015em;color:#fff;line-height:1.1}
  .meta{margin-top:4px;color:var(--ink-3);font-size:.82rem;font-weight:500;letter-spacing:-.005em}
  .meta b{color:var(--ink-2);font-weight:600}

  .check{flex:0 0 28px;width:28px;height:28px;border-radius:50%;border:1.6px solid rgba(255,255,255,.28);display:grid;place-items:center;transition:all .25s cubic-bezier(.3,1.3,.4,1)}
  .check svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:opacity .2s, transform .25s cubic-bezier(.3,1.5,.4,1)}

  .glass.sel{border-color:rgba(10,132,255,.55);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.4),
      inset 0 -1px 0 rgba(0,0,0,.2),
      inset 0 0 0 0.5px rgba(90,200,250,.35),
      0 0 0 1px rgba(10,132,255,.35),
      0 30px 70px -22px rgba(10,132,255,.55),
      0 22px 50px -20px rgba(0,0,0,.55)}
  .glass.sel .check{border-color:transparent;background:linear-gradient(145deg,#5ac8fa,#0a84ff);box-shadow:0 0 0 1px rgba(10,132,255,.5), 0 6px 16px -4px rgba(10,132,255,.6)}
  .glass.sel .check svg{opacity:1;transform:scale(1)}

  .bot{margin-top:auto;padding-top:14px}
  .cta{width:100%;height:56px;border-radius:18px;border:0;cursor:pointer;position:relative;overflow:hidden;
    font:inherit;font-weight:700;letter-spacing:-.005em;font-size:1.05rem;color:#fff;
    background:linear-gradient(180deg,rgba(10,132,255,.9),rgba(10,100,230,.9));
    -webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.45),
      inset 0 -1px 0 rgba(0,0,0,.2),
      0 18px 36px -14px rgba(10,132,255,.55);
    opacity:.55;pointer-events:none;transition:opacity .25s, transform .2s}
  .cta.on{opacity:1;pointer-events:auto}
  .cta:active{transform:scale(.985)}
  .cta .ar{display:inline-block;margin-left:8px;font-weight:600}
  .cta .shine{position:absolute;left:-30%;top:0;bottom:0;width:60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(0);animation:none}
  .cta.on .shine{animation:sw 2.8s ease-in-out .4s infinite}
  @keyframes sw{0%{transform:translateX(0)}60%{transform:translateX(260%)}100%{transform:translateX(260%)}}

  .hint{text-align:center;color:var(--ink-3);font-size:.76rem;margin:10px 0 0;font-weight:500;letter-spacing:-.005em}

  /* ===== ANIMACIONES EXTRA — estilo iOS, sutiles ===== */
  /* entrada en cascada al cargar */
  .island,.titleBlock,.cards .glass,.bot{opacity:0;transform:translateY(14px);animation:rise .75s cubic-bezier(.22,1,.3,1) both}
  .island{animation-delay:.05s}
  .titleBlock{animation-delay:.14s}
  .cards .glass:nth-of-type(1){animation-delay:.22s}
  .cards .glass:nth-of-type(2){animation-delay:.3s}
  .bot{animation-delay:.42s}
  @keyframes rise{to{opacity:1;transform:none}}

  /* shimmer que recorre cada card */
  .glass .sweep{position:absolute;top:0;bottom:0;left:-40%;width:35%;z-index:2;pointer-events:none;
    background:linear-gradient(110deg,transparent 15%,rgba(255,255,255,.14) 50%,transparent 85%);
    transform:skewX(-14deg);opacity:0;animation:sweep 8s ease-in-out infinite;animation-delay:2s;border-radius:inherit}
  .cards .glass:nth-of-type(2) .sweep{animation-delay:5.5s}
  @keyframes sweep{0%,100%{opacity:0;left:-40%}18%{opacity:.75}55%{opacity:.75;left:110%}60%,100%{opacity:0;left:110%}}

  /* glow debajo de card seleccionada respira */
  .glass.sel::after{animation:breath 3.4s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.65}50%{opacity:1}}

  /* el monito respira */
  .icon .mono{animation:monobreath 4.2s ease-in-out infinite}
  @keyframes monobreath{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

  /* pulse del check cuando aún no hay selección (invita a tocar) */
  .glass:not(.sel) .check{animation:tapHint 2.6s ease-in-out infinite}
  @keyframes tapHint{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 0 6px rgba(255,255,255,.06)}}

  /* gradiente del título fluye */
  .ttl span{background-size:200% 100%;animation:flow 6s ease-in-out infinite}
  @keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

  /* el ring del badge acelera cuando seleccionas esa card */
  .glass.sel .icon .ring{animation-duration:7s}

  /* ripple al tocar la card */
  .glass .ripple{position:absolute;width:140px;height:140px;border-radius:50%;pointer-events:none;z-index:3;
    background:radial-gradient(circle,rgba(255,255,255,.3),transparent 65%);
    transform:translate(-50%,-50%) scale(.1);opacity:.7;animation:ripple .9s cubic-bezier(.3,.8,.3,1) forwards}
  @keyframes ripple{to{transform:translate(-50%,-50%) scale(5);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    .blob,.icon .ring,.icon .mono,.glass .sweep,.glass.sel::after,.glass:not(.sel) .check,.ttl span,.cta.on .shine{animation:none!important}
    .island,.titleBlock,.cards .glass,.bot{opacity:1;transform:none;animation:none}
  }
</style>
</head>
<body>

<div class="wall">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>
<div class="tint"></div>

<div class="scr">
  <div class="island"><span class="d"></span>Nyxel · Entorno</div>

  <div class="titleBlock">
    <div class="ttl">Elige tu <span>entorno</span></div>
    <div class="sub">¿Qué versión de Free Fire vas a preparar hoy?</div>
  </div>

  <div class="cards">

    <!-- FREE FIRE -->
    <div class="glass" id="c1" onclick="pick(this,'ff',event)">
      <span class="sweep"></span>
      <div class="row">
        <div class="icon">
          <div class="mono"></div>
          <div class="ring">
            <svg viewBox="0 0 100 100">
              <defs><path id="ringPath1" d="M50,50 m-42,0 a42,42 0 1,1 84,0 a42,42 0 1,1 -84,0"/></defs>
              <text font-size="9"><textPath href="#ringPath1" startOffset="0">NORMAL · NORMAL · NORMAL · NORMAL · </textPath></text>
            </svg>
          </div>
        </div>
        <div class="txt">
          <div class="name">Free Fire</div>
          <div class="meta"><b>Clásico</b> · 750 MB · iOS 13 o superior</div>
        </div>
        <div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
    </div>

    <!-- FREE FIRE MAX -->
    <div class="glass" id="c2" onclick="pick(this,'max',event)">
      <span class="sweep"></span>
      <div class="row">
        <div class="icon">
          <div class="mono"></div>
          <div class="ring">
            <svg viewBox="0 0 100 100">
              <defs><path id="ringPath2" d="M50,50 m-42,0 a42,42 0 1,1 84,0 a42,42 0 1,1 -84,0"/></defs>
              <text font-size="11"><textPath href="#ringPath2" startOffset="0">MAX · MAX · MAX · MAX · MAX · MAX · </textPath></text>
            </svg>
          </div>
        </div>
        <div class="txt">
          <div class="name">Free Fire <span style="font-weight:700;background:linear-gradient(90deg,#9a6bff,#5ac8fa);-webkit-background-clip:text;background-clip:text;color:transparent">MAX</span></div>
          <div class="meta"><b>HD · Ultra</b> · 2.1 GB · iOS 14 o superior</div>
        </div>
        <div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
    </div>

  </div>

  <div class="bot">
    <button class="cta" id="go" onclick="go()">
      <span class="shine"></span>
      <span id="goTxt">Continuar</span>
      <span class="ar">›</span>
    </button>
    <p class="hint">Puedes cambiar la versión cuando quieras.</p>
  </div>
</div>

    try{ window.webkit.messageHandlers.nyxel.postMessage({t:'pick', g:picked}); }catch(e){}
  }
  // API de Swift para pre-seleccionar al mostrar
  window.NYXEL_setGame = function(g){
    var el = (g==='max') ? document.getElementById('c2') : document.getElementById('c1');
    if(el) pick(el, (g==='max'?'max':'ff'), null);
  };
  // Hover selection = ligero toque también envía mensaje al tocar (sin esperar Continuar)
  window.NYXEL_notifySelection = function(k){
    try{ window.webkit.messageHandlers.nyxel.postMessage({t:'preview', g:k}); }catch(e){}
  };
</script>
