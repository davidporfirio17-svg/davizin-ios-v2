<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Outfit</title>
<style>
  :root{
    --ink:#f3f6ff; --ink-2:rgba(240,245,255,.72); --ink-3:rgba(230,238,255,.5);
    --blue:#0a84ff; --blue-2:#5ac8fa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;overflow-x:hidden;overflow-y:auto}
  body{color:var(--ink);font-family:-apple-system,'SF Pro Display','Inter',system-ui,sans-serif;background:#02040a;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

  /* wallpaper */
  .wall{position:fixed;inset:0;z-index:0;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.6;will-change:transform}
  .b1{width:70vw;height:70vw;left:-20vw;top:-10vh;background:#2fb6ff;animation:d1 22s ease-in-out infinite alternate}
  .b2{width:80vw;height:80vw;right:-30vw;top:10vh;background:#7a5cff;animation:d2 26s ease-in-out infinite alternate}
  .b3{width:70vw;height:70vw;left:-15vw;bottom:-20vh;background:#0a84ff;animation:d3 30s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(12vw,6vh) scale(1.1)}}
  @keyframes d2{to{transform:translate(-10vw,-4vh) scale(.95)}}
  @keyframes d3{to{transform:translate(6vw,-6vh) scale(1.08)}}
  .tint{position:fixed;inset:0;z-index:1;background:radial-gradient(70% 55% at 50% 30%,transparent,rgba(0,0,0,.55) 90%)}

  .scr{position:relative;z-index:3;min-height:100vh;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}

  .island{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
    font-size:.64rem;font-weight:700;letter-spacing:.14em;color:#eaf0ff;text-transform:uppercase;
    background:rgba(10,12,20,.55);border:0.5px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);
    box-shadow:0 10px 30px -14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.14)}
  .island .d{width:7px;height:7px;border-radius:50%;background:#30d158;box-shadow:0 0 10px #30d158}

  /* Hero del jugador */
  .hero{margin:22px auto 20px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;text-align:center}
  .ava{width:132px;height:132px;border-radius:50%;background:#0a0f1e center/cover no-repeat;border:2.5px solid rgba(255,255,255,.35);
    box-shadow:0 14px 40px -8px rgba(0,0,0,.6), 0 0 48px rgba(90,200,250,.28), inset 0 2px 0 rgba(255,255,255,.3);
    position:relative;animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  .ava.fallback{display:grid;place-items:center;font-size:2.8rem;color:rgba(255,255,255,.3);font-weight:800}
  .name{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1;
    background:linear-gradient(90deg,#fff,#cfe3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .uid{font-family:'SF Mono',ui-monospace,monospace;font-size:.72rem;letter-spacing:.14em;color:rgba(255,255,255,.52)}
  .ranks{display:flex;gap:7px;margin-top:4px}
  .rp{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:.6rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#cfe3ff;
    background:rgba(10,14,22,.55);border:0.5px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .rp .k{color:#8ab4ff;font-weight:900}

  /* Seccion Outfit */
  .sec{max-width:560px;margin:0 auto;padding:0 2px}
  .sh{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 12px}
  .sh .l{display:flex;flex-direction:column;gap:2px}
  .sh .lb{font-size:.6rem;font-weight:800;letter-spacing:.3em;color:rgba(200,215,245,.55);text-transform:uppercase}
  .sh h2{margin:0;font-size:1.18rem;font-weight:700;letter-spacing:-.015em;color:#fff}
  .sh .count{font-size:.7rem;font-weight:700;color:rgba(200,215,245,.55)}
  .sh .count b{color:#fff}

  /* Grid de prendas */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media (min-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}

  .slot{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;cursor:pointer;
    background:linear-gradient(170deg,rgba(255,255,255,.12),rgba(255,255,255,.03) 55%,rgba(255,255,255,.015));
    -webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);
    border:0.5px solid rgba(255,255,255,.1);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.18), 0 10px 22px -14px rgba(0,0,0,.5);
    transition:transform .14s, border-color .22s, box-shadow .22s;opacity:0;animation:rise .5s cubic-bezier(.22,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .slot:active{transform:scale(.96)}
  .slot img{width:100%;height:100%;object-fit:contain;padding:12px;transition:transform .5s cubic-bezier(.22,1,.3,1)}
  .slot:hover img{transform:scale(1.07)}
  .slot .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.14);font-size:2rem;font-weight:800}
  .slot .rar{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%}
  .slot .rar.ORANGE_PLUS,.slot .rar.ORANGE{background:#ff8c3a;box-shadow:0 0 8px #ff8c3a}
  .slot .rar.PURPLE_PLUS,.slot .rar.PURPLE{background:#b76bff;box-shadow:0 0 8px #b76bff}
  .slot .rar.BLUE_PLUS,.slot .rar.BLUE{background:#5ac8fa;box-shadow:0 0 8px #5ac8fa}
  .slot .rar.GREEN{background:#30d158;box-shadow:0 0 8px #30d158}
  .slot .rar.WHITE_PLUS,.slot .rar.WHITE{background:#fff;box-shadow:0 0 8px #fff}
  .slot .tag{position:absolute;left:6px;bottom:6px;z-index:2;font-size:.52rem;font-weight:900;letter-spacing:.14em;padding:3px 7px;border-radius:999px;color:#eaf0ff;background:rgba(10,14,22,.65);border:0.5px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-transform:uppercase}

  .empty{padding:40px 16px;text-align:center;color:var(--ink-3)}
  .empty h3{color:#fff;font-weight:700;margin:0 0 6px}

  .loading{text-align:center;padding:60px 16px;color:var(--ink-3)}
  .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.14);border-top-color:#5ac8fa;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 14px}
  @keyframes r{to{transform:rotate(360deg)}}

  /* Preview fullscreen */
  .pmask{position:fixed;inset:0;z-index:40;background:rgba(2,4,10,.75);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);opacity:0;pointer-events:none;transition:opacity .28s}
  .pmask.on{opacity:1;pointer-events:auto}
  .pview{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:28px;opacity:0;pointer-events:none;transition:opacity .28s}
  .pview.on{opacity:1;pointer-events:auto}
  .pcard{position:relative;width:100%;max-width:380px;border-radius:26px;overflow:hidden;
    background:linear-gradient(170deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 60%);
    -webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);
    border:0.5px solid rgba(255,255,255,.18);
    box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 -1px 0 rgba(0,0,0,.25) inset,0 30px 70px -20px rgba(0,0,0,.65);
    animation:pop .35s cubic-bezier(.3,1.3,.4,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}}
  .pcard .img{aspect-ratio:1/1;position:relative;background:radial-gradient(60% 50% at 50% 35%,rgba(90,200,250,.2),transparent 60%),linear-gradient(170deg,rgba(0,0,0,.4),rgba(0,0,0,.6))}
  .pcard .img img{width:100%;height:100%;object-fit:contain;padding:36px}
  .pcard .meta{padding:16px 18px 20px}
  .pcard .ty{font-size:.58rem;font-weight:900;letter-spacing:.3em;color:#8ab4ff;text-transform:uppercase;margin-bottom:4px}
  .pcard .nm{font-size:1.2rem;font-weight:700;letter-spacing:-.015em;color:#fff;line-height:1.15}
  .pcard .de{color:var(--ink-2);font-size:.82rem;margin-top:8px;line-height:1.4;max-height:5em;overflow:hidden}
  .pcard .pills{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
  .pcard .pill{font-size:.56rem;font-weight:800;letter-spacing:.14em;padding:5px 10px;border-radius:999px;color:#fff;text-transform:uppercase;background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.14)}
  .pcard .pill.rare{color:#ffcf7a;border-color:rgba(255,180,100,.4);background:rgba(50,30,10,.5)}
  .pcard .pill.id{font-family:'SF Mono',ui-monospace,monospace;letter-spacing:.06em;color:rgba(255,255,255,.6)}
  .pclose{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(10,14,22,.55);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center;z-index:2;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

  @media (prefers-reduced-motion:reduce){.blob,.ava,.pcard,.slot{animation:none}}
</style>
</head>
<body>

<div class="wall">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>
<div class="tint"></div>

<div class="scr">
  <div class="island"><span class="d"></span>Outfit · Loadout</div>

  <div class="hero">
    <div class="ava fallback" id="ava">?</div>
    <div class="name" id="name">—</div>
    <div class="uid" id="uid">UID —</div>
    <div class="ranks" id="ranks"></div>
  </div>

  <!-- Banner oficial del perfil (API SiamBhau /banner/profile) -->
  <div class="sec" id="bannerWrap" style="display:none">
    <div class="sh"><div class="l"><span class="lb">Banner oficial</span><h2>Perfil del jugador</h2></div></div>
    <div style="border-radius:18px;overflow:hidden;background:rgba(0,0,0,.4);border:0.5px solid rgba(255,255,255,.1);box-shadow:0 14px 38px -18px rgba(0,0,0,.6)">
      <img id="bannerImg" style="width:100%;height:auto;display:block;opacity:0;transition:opacity .4s" onload="this.style.opacity=1" onerror="document.getElementById('bannerWrap').style.display='none'">
    </div>
  </div>

  <!-- Render oficial del personaje vestido (API SiamBhau /outfits/outfit) -->
  <div class="sec" id="renderWrap" style="display:none">
    <div class="sh">
      <div class="l">
        <span class="lb">Personaje 3D</span>
        <h2>Outfit en vivo</h2>
      </div>
      <div class="count">1024×1024</div>
    </div>
    <div style="position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(170deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:0.5px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 20px 50px -20px rgba(0,0,0,.6)">
      <div id="renderLoad" style="position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.5);font-size:.85rem;z-index:1"><div><div class="spin"></div><div style="margin-top:10px">Renderizando personaje…</div></div></div>
      <img id="renderImg" style="width:100%;height:auto;display:block;position:relative;z-index:2;opacity:0;transition:opacity .4s" onload="this.style.opacity=1;document.getElementById('renderLoad').style.display='none'" onerror="document.getElementById('renderWrap').style.display='none'">
    </div>
  </div>

  <!-- Insights: ban check + login history -->
  <div class="sec" id="insightsWrap" style="display:none">
    <div class="sh"><div class="l"><span class="lb">Intel</span><h2>Estado de la cuenta</h2></div></div>
    <div id="insightsBody" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>

  <div class="sec">
    <div class="sh">
      <div class="l">
        <span class="lb">Colección</span>
        <h2>Prendas equipadas</h2>
      </div>
      <div class="count"><b id="cnt">0</b> items</div>
    </div>
    <div id="grid" class="grid">
      <div class="loading" style="grid-column:1/-1"><div class="spin"></div>Cargando catálogo…</div>
    </div>
  </div>
</div>

<div class="pmask" id="pmask" onclick="closeP()"></div>
<div class="pview" id="pview"></div>

<script>
  var CATALOG = null;
  var PENDING_SUMMARY = null;
  var CATALOG_URL = 'https://raw.githubusercontent.com/davidporfirio17-svg/nyxel-ff-assets/main/items.json';

  // Mapping de "tipo de slot" por heurística del nombre del icon
  function slotOf(icon){
    if(!icon) return null;
    var low = icon.toLowerCase();
    if(/_hat_|_helmet_/.test(low)) return 'HAT';
    if(/_hair_|_hairroot_/.test(low)) return 'HAIR';
    if(/_top_|_shirt_|_vest_|_tshirt_|_upperbody_|_coat_/.test(low)) return 'TOP';
    if(/_bottom_|_pants_|_skirt_|_short_|_lowerbody_/.test(low)) return 'BOTTOM';
    if(/_shoe_|_shoes_|_boot_/.test(low)) return 'SHOES';
    if(/_accessory_|_glass_|_mask_|_face_/.test(low)) return 'ACC';
    if(/_body_|_back_|_wing_/.test(low)) return 'BODY';
    if(/_headadditive_/.test(low)) return 'HEAD+';
    return 'OTHER';
  }

  function cleanName(icon, id){
    if(!icon || icon==='NONE') return 'Item '+id;
    return icon.replace(/^(Icon_|cloth_|icon_|avatar_)/i,'').replace(/_/g,' ').replace(/\b\w/g, function(c){return c.toUpperCase();});
  }

  // Swift llama esto: NYXEL_setOutfitData({ nickname, uid, level, likes, region, br, cs, avatarURL, bannerURL, renderURL, clothesIDs: [...], weaponSkinIDs:[...], ... })
  window.NYXEL_setOutfitData = function(d){
    PENDING_SUMMARY = d;
    // Banner oficial via SiamBhau
    if(d.bannerSiamURL){
      document.getElementById('bannerWrap').style.display = 'block';
      document.getElementById('bannerImg').src = d.bannerSiamURL;
    }
    // Render oficial del personaje via API SiamBhau
    if(d.renderURL){
      document.getElementById('renderWrap').style.display = 'block';
      document.getElementById('renderImg').src = d.renderURL;
    }
    // Insights: ban check + login history (JSON endpoints)
    if(d.banCheckURL || d.loginHistoryURL){ loadInsights(d); }
    renderAll();
  };

  // ============ INSIGHTS (ban check + login history) ============
  function pill(label, val, color){
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:0.5px solid '+color+';-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)">'+
      '<div style="font-size:.66rem;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.6);text-transform:uppercase">'+label+'</div>'+
      '<div style="font-size:.9rem;font-weight:700;color:#fff;text-align:right">'+val+'</div>'+
    '</div>';
  }

  function loadInsights(d){
    var body = document.getElementById('insightsBody');
    var wrap = document.getElementById('insightsWrap');
    wrap.style.display = 'block';
    body.innerHTML = '<div class="loading"><div class="spin"></div>Consultando estado…</div>';
    var results = {ban:null, login:null};
    var done = 0, total = 0;
    function render(){
      var html = '';
      if(results.ban){
        var b = results.ban;
        if(b.err){ html += pill('Ban Check', '<span style="color:#ff948b">'+b.err+'</span>', 'rgba(255,255,255,.1)'); }
        else {
          var banned = (b.is_banned===true || b.isBanned===true || b.banned===true || (typeof b.status==='string' && b.status.toLowerCase().indexOf('ban')>=0));
          html += pill('Ban Check',
            banned ? '<span style="color:#ff948b">⚠ BANEADO</span>' : '<span style="color:#86f5a3">✓ Cuenta limpia</span>',
            banned ? 'rgba(255,69,58,.35)' : 'rgba(48,209,88,.3)');
          if(b.period) html += pill('Periodo del ban', b.period, 'rgba(255,69,58,.3)');
        }
      }
      if(results.login){
        var l = results.login;
        if(l.err){ html += pill('Última conexión', '<span style="color:#ff948b">'+l.err+'</span>', 'rgba(255,255,255,.1)'); }
        else {
          var last = l.last_login || l.lastLogin || l.last_online || l.lastOnline || (l.history && l.history[0] && (l.history[0].time||l.history[0].date||l.history[0].ts)) || (l.data && l.data.last_login) || null;
          html += pill('Última conexión', last ? '<span style="color:#86f5a3">'+last+'</span>' : '—', 'rgba(255,255,255,.1)');
          var cnt = (l.history && l.history.length) || (l.data && l.data.history && l.data.history.length) || null;
          if(cnt) html += pill('Logins registrados', cnt, 'rgba(255,255,255,.1)');
        }
      }
      body.innerHTML = html || '<div class="empty">Sin datos disponibles</div>';
    }
    function fetchJson(url, slot){
      total++;
      fetch(url).then(function(r){ return r.text().then(function(t){
        try{ results[slot] = JSON.parse(t); }
        catch(e){ results[slot] = {err:'Respuesta inválida (HTTP '+r.status+')'}; }
      }); }).catch(function(e){
        results[slot] = {err:'Sin conexión'};
      }).finally(function(){ done++; if(done===total) render(); });
    }
    if(d.banCheckURL) fetchJson(d.banCheckURL, 'ban');
    if(d.loginHistoryURL) fetchJson(d.loginHistoryURL, 'login');
  }

  function renderAll(){
    if(!PENDING_SUMMARY) return;
    var d = PENDING_SUMMARY;
    document.getElementById('name').textContent = d.nickname || 'Jugador';
    document.getElementById('uid').textContent  = 'UID ' + (d.uid || '—');
    if(d.avatarURL){
      var a = document.getElementById('ava');
      a.classList.remove('fallback'); a.textContent='';
      a.style.backgroundImage = 'url("'+d.avatarURL+'")';
    }
    var ranks = document.getElementById('ranks'); ranks.innerHTML='';
    function pill(k, v){ if(!v||v==='—'||v==='') return; var el=document.createElement('span'); el.className='rp'; el.innerHTML='<span class="k">'+k+'</span><span>'+v+'</span>'; ranks.appendChild(el); }
    pill('BR', d.br||'');
    pill('CS', d.cs||'');
    pill('LV', d.level||'');
    pill('♥', d.likes||'');

    if(!CATALOG){ return; } // esperando catálogo
    renderGrid();
  }

  function renderGrid(){
    var d = PENDING_SUMMARY; if(!d || !CATALOG) return;
    var grid = document.getElementById('grid');
    var ids = [].concat(d.clothesIDs||[], d.weaponSkinIDs||[]);
    if(d.bannerID) ids.push(d.bannerID);
    if(d.headPicID) ids.push(d.headPicID);
    if(d.petID) ids.push(d.petID);

    // Deduplicar manteniendo orden
    var seen = {}; ids = ids.filter(function(x){ if(!x||x==='0'||seen[x])return false; seen[x]=1; return true; });
    document.getElementById('cnt').textContent = ids.length;

    if(!ids.length){
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><h3>Sin prendas visibles</h3>El jugador no tiene ropa equipada o su perfil es privado.</div>';
      return;
    }

    var html = ids.map(function(id, i){
      var it = CATALOG[String(id)] || {};
      var rareClass = (it.rare || 'NONE').replace(/[^A-Z_]/g,'');
      var imgHtml = it.img ? '<img loading="lazy" src="'+it.img+'">' : '<div class="ph">?</div>';
      var slot = slotOf(it.icon);
      var tag = slot ? '<span class="tag">'+slot+'</span>' : '';
      var delay = Math.min(i*60, 800);
      return '<div class="slot" style="animation-delay:'+delay+'ms" onclick="openP(\''+id+'\')">'+imgHtml+'<span class="rar '+rareClass+'"></span>'+tag+'</div>';
    }).join('');
    grid.innerHTML = html;
  }

  function openP(id){
    var it = CATALOG[String(id)] || {};
    var rareClass = (it.rare||'NONE').replace(/[^A-Z_]/g,'');
    var isPlus = rareClass.indexOf('PLUS')>=0 || rareClass==='ORANGE';
    var name = cleanName(it.icon, id);
    var desc = (it.desc && it.desc!=='Nulla' && it.desc!=='NONE' ? it.desc : (it.desc2 || ''));
    if(desc==='NONE' || desc==='Nulla') desc = '';
    var pills = '';
    if(it.type && it.type!=='NONE') pills += '<span class="pill">'+it.type+'</span>';
    if(it.rare && it.rare!=='NONE') pills += '<span class="pill '+(isPlus?'rare':'')+'">'+it.rare.replace(/_/g,' ')+'</span>';
    if(it.collection && it.collection!=='NONE') pills += '<span class="pill">'+it.collection+'</span>';
    pills += '<span class="pill id">ID '+id+'</span>';
    var imgHtml = it.img ? '<img src="'+it.img+'">' : '<div style="display:grid;place-items:center;height:100%;color:rgba(255,255,255,.18);font-size:3rem">?</div>';
    document.getElementById('pview').innerHTML =
      '<div class="pcard">'+
        '<button class="pclose" onclick="closeP()">×</button>'+
        '<div class="img">'+imgHtml+'</div>'+
        '<div class="meta">'+
          '<div class="ty">'+(it.type||'Item')+'</div>'+
          '<div class="nm">'+name+'</div>'+
          (desc?'<div class="de">'+desc.replace(/</g,'&lt;')+'</div>':'')+
          '<div class="pills">'+pills+'</div>'+
        '</div>'+
      '</div>';
    document.getElementById('pmask').classList.add('on');
    document.getElementById('pview').classList.add('on');
    try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}
  }
  function closeP(){
    document.getElementById('pmask').classList.remove('on');
    document.getElementById('pview').classList.remove('on');
  }
  window.closeP = closeP;
  window.openP = openP;

  // Cargar catálogo
  fetch(CATALOG_URL).then(function(r){ return r.json(); }).then(function(d){
    CATALOG = d; renderAll();
  }).catch(function(){
    document.getElementById('grid').innerHTML = '<div class="empty" style="grid-column:1/-1"><h3>Sin conexión</h3>No se pudo cargar el catálogo de items. Revisa tu internet y vuelve a entrar.</div>';
  });
</script>
</body></html>
