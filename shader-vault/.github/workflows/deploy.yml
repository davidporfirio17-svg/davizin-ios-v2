name: Build & Deploy Shader Vault

on:
  push:
    branches: [main, claude/new-session-apycda]
    paths:
      - 'shader-vault/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shader-vault
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build data.json + copy assets
        run: node scripts/build.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shader-vault/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
