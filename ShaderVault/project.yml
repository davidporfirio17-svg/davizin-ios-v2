name: ShaderVault
options:
  bundleIdPrefix: com.davizin
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ShaderVault:
    type: application
    platform: iOS
    sources:
      - ShaderVault
    settings:
      base:
        INFOPLIST_FILE: ShaderVault/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.davizin.shadervault
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
