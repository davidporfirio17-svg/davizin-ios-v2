name: Build ShaderVault IPA

on:
  push:
    branches: [main, claude/*]
    paths:
      - 'ShaderVault/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ShaderVault
        run: xcodegen generate

      - name: Build Archive
        working-directory: ShaderVault
        run: |
          xcodebuild archive \
            -project ShaderVault.xcodeproj \
            -scheme ShaderVault \
            -configuration Release \
            -archivePath build/ShaderVault.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Export IPA
        working-directory: ShaderVault
        run: |
          mkdir -p build/ipa
          # Create export options plist for ad-hoc (no signing)
          cat > build/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST

          # Create IPA manually from archive
          cd build/ShaderVault.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r ShaderVault.app Payload/
          zip -r ../../../ipa/ShaderVault.ipa Payload
          cd ../../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShaderVault-IPA
          path: ShaderVault/build/ipa/ShaderVault.ipa
          retention-days: 30

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: ShaderVault-Archive
          path: ShaderVault/build/ShaderVault.xcarchive
          retention-days: 7
